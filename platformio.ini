; tinyml-esp32-anomaly: one ESP32 environment (TensorFlow Lite Micro inference sketch) plus
; `native` for the host tests of lib/anomaly_core.
;
; Flash:         pio run -e esp32dev -t upload && pio device monitor
; Host tests:    pio test -e native        (or `make check`, plain g++)

[platformio]
default_envs = esp32dev

[env]
test_framework = custom
build_flags =
    -std=gnu++17
    -Wall -Wextra

[env:esp32dev]
platform = espressif32@^6.9.0   ; Arduino-ESP32 core 2.0.x
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
test_ignore = *                  ; unit tests run on the host only

[env:native]
; Runs test/test_native/test_core.cpp (self-contained asserts, see test/minitest.h).
platform = native
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
build_src_filter = -<*>
lib_compat_mode = off
